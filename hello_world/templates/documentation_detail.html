{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ doc.title }}</title>
    <link rel="stylesheet" href="{% static 'main.css' %}">
</head>
<body>
    <div class="container" style="padding: 40px;">
        <a href="/" style="display:inline-block; margin-bottom:20px;">← Powrót</a>
        <h1>{{ doc.title }}</h1>
        <p><strong>Typ:</strong> {{ doc.get_document_type_display }} — <strong>Autor:</strong> {{ doc.author.get_full_name|default:doc.author.username }}</p>
        <hr>
        <div style="white-space: pre-wrap; margin-top:20px;">
            {{ doc.content }}
        </div>
        {% if doc.experiment %}
        <p style="margin-top:20px;">Powiązany eksperyment: {{ doc.experiment.title }}</p>
        {% endif %}
    </div>
</body>
</html>
